name: Dependabot auto-merge
on: pull_request_target

# Nothing here uses the workflow's own GITHUB_TOKEN: every API call runs through
# the App token minted below. So the job needs no permissions of its own, and
# an empty map is the least privilege this trigger can be given. `pull_request_target`
# runs against the base repo with secrets in scope, which is exactly why the
# default token should carry nothing.
permissions: {}

# Dependabot force-pushes its branch to rebase, and each push re-fires
# `pull_request_target`. Without this, a second run starts while the first is
# still watching checks and both race to merge the same PR. Keyed per PR so a
# busy day does not drop other PRs: GitHub keeps only one pending run per group,
# so a repo-wide key would silently cancel queued merges.
concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `gh pr checks --watch` blocks until every required check settles. Cap it so
    # a check that never reports cannot hold a runner for the 6 hour default.
    timeout-minutes: 30
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Create GitHub App token
        id: app-token
        # Pinned to a commit rather than a tag. Tags are mutable, and this step
        # mints a token that can approve and merge.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_KEY }}

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ steps.app-token.outputs.token }}"
          # Commit verification is deliberately left ON (the action's default).
          # It checks that the commits really are Dependabot's, which is the one
          # assurance that matters when the reward for a match is an auto-merge.

      - name: Approve PR + merge after required checks pass
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          set -euo pipefail
          review_decision=$(gh pr view "$PR_URL" --json reviewDecision -q .reviewDecision)
          if [ "$review_decision" != "APPROVED" ]; then
            gh pr review --approve "$PR_URL"
          else
            echo "PR already approved."
          fi

          # `Workers Builds: telemetry-collector` is a required check on
          # development, so --required covers the deploy without naming it here.
          echo "Waiting for required checks to complete successfully..."
          gh pr checks "$PR_URL" --required --watch

          echo "Required checks passed. Merging..."
          gh pr merge --admin --squash "$PR_URL"
        env:
          # Passed as env, never interpolated into the script body: `${{ }}` inside
          # `run:` would let PR-controlled text execute as shell.
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
